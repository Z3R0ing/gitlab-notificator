label-rules:
  enabled: true
  debounce: 5m
  escalation-delay: 1h

  forbid-unknown-labels: true

  groups:
    - name: Status
      prefix: "S:"
      min: 1
      max: 1
    - name: Type
      prefix: "T:"
      min: 1
      max: 1
    - name: Blocked
      prefix: "B:"
      max: 1
    - name: Domain
      prefix: "D:"
      min: 1
    - name: Target
      prefix: "Tgt:"
      min: 1
      max: 2
    - name: Source
      prefix: "Src:"
      max: 1
    - name: Priority
      prefix: "P:"
      max: 1
    - name: Environment
      prefix: "E:"
